services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: novatek_db
      MYSQL_USER: novateck
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/novatek_schema_v2.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: novatek_db
      DB_USER: novateck
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
  crawler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: novatek_db
      DB_USER: novateck
    command: ["python", "job_sync.py"]
    profiles: ["maintenance"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
