name: Sync cloud jobs

on:
  workflow_dispatch:
  schedule:
    # Twice daily in UTC; deliberately avoid the busiest top-of-hour period.
    - cron: '17 6,18 * * *'

permissions:
  contents: read

concurrency:
  group: cloud-job-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_HOST: ${{ secrets.CLOUD_DB_HOST }}
      DB_PORT: ${{ secrets.CLOUD_DB_PORT }}
      DB_NAME: ${{ secrets.CLOUD_DB_NAME }}
      DB_USER: ${{ secrets.CLOUD_DB_USER }}
      DB_PASSWORD: ${{ secrets.CLOUD_DB_PASSWORD }}
      DB_SSL_CA: ${{ github.workspace }}/backend/aiven-ca.pem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Prepare verified database connection
        env:
          CLOUD_DB_CA: ${{ secrets.CLOUD_DB_CA }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          required = ['DB_HOST', 'DB_PORT', 'DB_NAME', 'DB_USER', 'DB_PASSWORD', 'CLOUD_DB_CA']
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing repository secrets for: ' + ', '.join(missing))
          path = Path(os.environ['DB_SSL_CA'])
          path.write_text(os.environ['CLOUD_DB_CA'])
          path.chmod(0o600)
          PY
      - run: pip install -r backend/requirements.txt
      - name: Synchronize employer listings
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'backend')
          from job_sync import SyncSettings, sync_jobs
          stats = sync_jobs(SyncSettings.from_environment())
          print('Job sync complete: ' + ', '.join(f'{key}={value}' for key, value in stats.items()))
          if stats['errors']:
              raise SystemExit('Some sources failed; review the logs. Successful imports were retained.')
          PY
