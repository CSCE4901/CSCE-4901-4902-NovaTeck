name: Validate
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm audit
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: novatek_db
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: integration-only-password
      DB_NAME: novatek_db
      JWT_SECRET: integration-only-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pip-audit
      - run: python -m unittest discover -s backend/tests
      - run: python backend/tests/integration_mysql.py
      - run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-3740
      - run: docker build -f backend/Dockerfile . && docker build -f frontend/Dockerfile .
